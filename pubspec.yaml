name: connectivity_control
description: "A Flutter plugin to inspect active network interfaces and their internet capability, validation state, metering, and bandwidth."
version: 1.1.0
homepage: https://github.com/axions-org/connectivity_control
repository: https://github.com/axions-org/connectivity_control
issue_tracker: https://github.com/axions-org/connectivity_control/issues
topics:
  - connectivity
  - network
  - wifi
  - networking
  - network-info

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: tech.axions.connectivity_control
        pluginClass: ConnectivityControlPlugin
      ios:
        pluginClass: ConnectivityControlPlugin
      macos:
        pluginClass: ConnectivityControlPlugin