name: connectivity_control
description: "A Flutter plugin to inspect active network interfaces and their internet capability, validation state, metering, and bandwidth."
version: 0.0.1
repository: https://github.com/buildwithpulkit/connectivity_control

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: me.pulkitagarwal.connectivity_control
        pluginClass: ConnectivityControlPlugin